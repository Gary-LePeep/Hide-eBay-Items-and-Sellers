name: Run Tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Install dependencies
              run: npm ci

            - name: Build the project
              run: npm run build

            # npm test starts the fixture servers itself, see test/run-tests.mjs.
            # The github-actions reporter turns each failing test into an annotation, so a
            # failure is readable from the run summary without opening the full log.
            - name: Run tests
              run: npm test -- --reporters=default --reporters=github-actions
