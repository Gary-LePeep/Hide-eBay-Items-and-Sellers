<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>easyBlock - Disabled</title>

    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/popup.css">
</head>

<body>
    <div class="header">
        <h3>easyBlock</h3>
    </div>
    <div class="container">
        <div class="alert alert-primary mt-3" role="alert">
            <h5 class="alert-heading">Disabled for this site</h5>
            <h7>easyBlock is not hiding anything here. Your hidden items and sellers are still saved.</h7>
        </div>
        <button class="btn btn-outline-danger" type="button" id="reenableForSite">
            <span>Re-enable for this site</span>
        </button>
    </div>

    <script src="../resources/jquery-3.4.1.min.js"></script>
    <script src="../resources/bootstrap.min.js"></script>
    <script src="../popup.bundle.js" type="module" defer></script>
</body>

</html>
